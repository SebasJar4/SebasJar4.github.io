<html>
    
    <head>
        <meta charset=utf-8>
        <title>My first Three.js app</title>

        
<style>
    body {
    margin: 0;
    display: grid;
}

body.modal_open {
    overflow: hidden; /* Evita el scroll cuando el modal está abierto */
}

canvas {
    width: 100%;
    height: 100%;
}

/* Fondo negro cubriendo toda la pantalla */
 .modal_overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000000aa;
    z-index: 99;
    visibility: visible;
    opacity: 1;
    transition: opacity 0.3s ease-in-out;
}

/* Ocultar el fondo antes de abrir el modal */
body::before {
    visibility: hidden;
    opacity: 0;
}

/* Contenedor del modal */
.modal_content {
    position: fixed;
    justify-self: center;
    align-self: center;
    width: 42vw;
    height: fit-content;
    background-color: #fff;
    padding: 1rem;
    border-radius: 10%;
    z-index: 100;
    /* visibility: hidden; */
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

/* Mostrar modal cuando está activo */
.modal_active {
    visibility: visible;
    opacity: 1;
    display: grid;
}

</style>
</head>

<body>
    <div class="modal_overlay"></div>

    <div class="modal_content modal_active" id="modal_bienvenida">
        <dev class="modal">
            <div class="modal_head">
                <h1>Bienvenido</h1>
                <div><button class="modal_close" type="button">x</button></div>
            </div>
            <div class="modal_body">
                <p>Esta es mi pagina donde haré mis pruebas para embebidos...</p>
            </div>
            <div class="modal_footer">
                <button class="modal_close" type="button">x</button>
            </div>
        </dev>
    </div>
    
    <script>
        window.addEventListener( "load" , () =>{
            animate();
        } );
        function close_modal () {
            document.querySelector(".modal_content").classList.remove("modal_active");
            overlay.parentNode.removeChild(document.querySelector(".modal_overlay"));
            pausar_juego(false);  // Asegúrate de que esta función esté definida
        }

        document.querySelector(".modal_active").addEventListener("click", close_modal );


        document.querySelectorAll(".modal_close").forEach( button => {
            button.addEventListener( 'click' , close_modal );
        })

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.js"></script>
    <script>
// import * as THREE f  rom "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Crear carretera
const roadGeometry = new THREE.PlaneGeometry(10, 100);
const roadMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
const road = new THREE.Mesh(roadGeometry, roadMaterial);
road.rotation.x = -Math.PI / 2;
scene.add(road);

let isPaused = true;


// Crear carro del jugador
const carGeometry = new THREE.BoxGeometry(1, 0.5, 2);
const carMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const playerCar = new THREE.Mesh(carGeometry, carMaterial);
playerCar.position.y = 0.25;
playerCar.position.z = 10;
scene.add(playerCar);

// Generar carros aleatorios
const cars = [];
function spawnCar() {
    const enemyCar = new THREE.Mesh(carGeometry, new THREE.MeshBasicMaterial({ color: 0x0000ff }));
    enemyCar.position.set((Math.random() * 8) - 4, 0.25, -50);
    cars.push(enemyCar);
    scene.add(enemyCar);
    setTimeout(spawnCar, Math.random() * 2000 + 1000);
}
spawnCar();

// Movimiento del jugador
const keys = {};
window.addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
window.addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));

function updatePlayer() {
    if (keys['w']) playerCar.position.z -= 0.2;
    if (keys['s']) playerCar.position.z += 0.2;
    if (keys['a']) playerCar.position.x -= 0.2;
    if (keys['d']) playerCar.position.x += 0.2;
    camera.position.z = playerCar.position.z + 5;
    camera.position.x = playerCar.position.x;
    camera.lookAt(playerCar.position);

    const collision = cars.some(e => 
        Math.abs(playerCar.position.z - e.position.z) < 1 &&  // Comparar posición Z
        Math.abs(playerCar.position.x - e.position.x) < 1     // Comparar posición X
    );

    if (collision) {
        alert("¡Murió!");
        alert("se refrescara la pagina");
        location.reload();
        return false;
    }
    return true;
}

function pausar_juego( bool ) {
    if ( !bool ) animate();
    isPaused = bool;
}


// Animación principal
function animate() {
    if ( !updatePlayer() ) return;
    requestAnimationFrame(animate);
    cars.forEach(car => car.position.z += 0.2);
    renderer.render(scene, camera);
    if ( isPaused ) return;
}

window.addEventListener("resize" , function () {
  renderer
})

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix(); // ⚡ IMPORTANTE: Actualizar la matriz de proyección
    renderer.setSize(window.innerWidth, window.innerHeight);
});
    </script>
</body>
